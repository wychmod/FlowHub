<svg xmlns="http://www.w3.org/2000/svg" width="780" height="280" viewBox="0 0 780 280" role="img" aria-label="FlowHub - 企业级异步 Excel 导出中心">
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="72" y1="40" x2="440" y2="472">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="row" gradientUnits="userSpaceOnUse" x1="220" y1="222" x2="292" y2="290">
      <stop offset="0" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.16" r="0.95">
