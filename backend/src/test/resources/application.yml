# 测试环境数据源：使用 H2 内存库（MySQL 兼容模式）替代外部 MySQL。
# @SpringBootTest 启动完整上下文时会触发 Flyway 初始化，改用该数据源后，
# 单元/集成测试无需依赖本机 MySQL 即可运行（订单测试数据由 TestOrderDataSeeder 写入）。
# Flyway 在测试上下文自动执行 db/migration 迁移（spring.flyway.enabled 默认即为 true）。
spring:
  datasource:
    url: jdbc:h2:mem:flowhub_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  # 上传受理上限与主配置一致（本文件整体遮蔽主 application.yml，multipart 需在此重复声明）；
  # 超限用例据此构造 12MB 载荷断言 400 Envelope。
  servlet:
    multipart:
      max-file-size: 11MB
      max-request-size: 12MB
  # 消费监听容器不自启：测试上下文无真实 Broker，启动容器只会反复重连拖垮测试；
  # Consumer 逻辑由测试直接方法调用验证（同 OutboxDispatcher 直接调 dispatchPendingEvents 的惯例）。
  # 消费参数（manual/prefetch/concurrency）在主 application.yml，对不经容器的方法调用不生效，无需两处同步。
  rabbitmq:
    listener:
      simple:
        auto-startup: false
  # Redis 短超时：测试环境无真实 Redis，Lettuce 懒连接在投影写入时快速失败（走降级日志），
  # 避免默认连接超时拖慢每批进度推进。
  data:
    redis:
      connect-timeout: 100ms
      timeout: 100ms

# 注意：本文件会整体遮蔽主 application.yml（同名 classpath 资源 test-classes 优先），
# 因此 mybatis 配置需在此重复声明，与主配置保持一致；改动时两处同步。
mybatis:
  map-underscore-to-camel-case: true
  arg-name-based-constructor-auto-mapping: true
  mapper-locations: classpath:mapper/**/*.xml

# Outbox 分发调度禁用：@Scheduled 的 initialDelay 与 fixedDelay 共用该属性，置大即整体静默；
# 分发器测试直接调用 dispatchPendingEvents()，避免上下文刷新首火扫描共享 H2 中残留的未发布事件。
export:
  outbox:
    dispatch-delay-ms: 3600000
  # SSE 心跳静默（同 Outbox 惯例）：心跳测试直接调 broadcastHeartbeat()，避免定时器干扰。
  sse:
    heartbeat-ms: 3600000
  # 维护调度静默（"-" 为 Spring 约定的禁用 cron）：维护测试直接调 cleanupExpiredExports()/reconcileStaleFiles()。
  cleanup-cron: "-"
  # 测试用隔离文件根：避免各测试上下文的启动恢复/孤儿对账扫描真实 export-files 目录（dev 产物/测试残留）。
  files:
    dir: ${java.io.tmpdir}/flowhub-test-files

# 导入模块测试覆盖：Outbox 分发 / SSE 心跳 / 维护调度静默，错误报告缓冲收敛（直接方法调用验证）。
import:
  outbox:
    dispatch-delay-ms: 3600000
  sse:
    heartbeat-ms: 3600000
  cleanup-cron: "-"
  # 测试用隔离文件根：启动恢复/孤儿对账扫描隔离 tmp 目录，不碰 dev 的 import-files 产物。
  files:
    dir: ${java.io.tmpdir}/flowhub-test-import-files
