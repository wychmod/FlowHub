server:
  port: 8080

spring:
  application:
    name: export-flow-backend
  # MySQL 数据源。Flyway 依赖该 DataSource，在应用启动时自动执行 src/main/resources/db/migration 下的迁移脚本。
  datasource:
    url: jdbc:mysql://localhost:3306/exportflow?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC
    username: exportflow
    password: exportflow
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

# 日志级别中附带 trace_id，配合 TraceIdFilter 写入的 MDC 使用
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{trace_id:-}]"

# 后续迭代按 be-td.md 第 12 章补充 Redis/RabbitMQ/导出目录等配置。
# 建表脚本放置在 src/main/resources/db/migration/V x__xxx.sql，由 Flyway 启动时自动执行。
mybatis:
  map-underscore-to-camel-case: true                  # 下划线列名 -> 驼峰属性
  arg-name-based-constructor-auto-mapping: true       # record 实体按构造器参数名自动映射（需 -parameters 编译参数，starter parent 默认开启）
  mapper-locations: classpath:mapper/**/*.xml          # XML 动态 SQL（订单查询见 mapper/OrderMapper.xml）
