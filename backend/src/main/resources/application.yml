server:
  port: 8080
  tomcat:
    # 超限上传被拒时吞掉整个请求体再回错，保证客户端能收到结构化 400（默认 2MB 会直接重置连接，
    # 浏览器 fetch 表现为网络错误/挂起而非 JSON 错误）。
    max-swallow-size: -1

spring:
  application:
    name: flow-hub-backend
  # 上传受理上限：业务层自校验 ≤10MB（IMPORT_FILE_TOO_LARGE），此处略放大让请求到达业务校验；
  # 超 max-file-size 的请求体由 OversizeRequestBodyFilter 先拒（drain 后回 400，避免容器中止
  # multipart 解析导致连接重置、客户端收不到响应）；容器闸仅作 chunked 等无长度场景兜底。
  servlet:
    multipart:
      max-file-size: 11MB
      max-request-size: 12MB
  # MySQL 数据源。Flyway 依赖该 DataSource，在应用启动时自动执行 src/main/resources/db/migration 下的迁移脚本。
  datasource:
    url: jdbc:mysql://localhost:3306/flowhub?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC
    username: flowhub
    password: flowhub
  flyway:
    enabled: true
  # RabbitMQ 连接与发布确认闭环（Outbox 分发器用）：correlated confirm 使每次发送可对上确认，
  # publisher-returns + template.mandatory 使不可路由消息退回可见而非静默丢弃——ACK 且无 Returned 才算投递成功。
  # listener 为消费端（ExportJobConsumer）参数：手动确认保留重投窗口（Ack 前崩溃消息不丢），
  # prefetch=1 保证每个 Consumer 确认当前 delivery 前不预取更多消息；并发防双执行靠 DB 条件抢占而非此处。
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        concurrency: 2
  # Redis（活跃进度投影）：ExportProgressService 尽力写 export:progress:<jobId> Hash + TTL 48h。
  # Redis 未启动时投影写入失败仅记 redis_progress_write_failed 降级日志，应用照常运行，
  # /actuator/health 的 redis 组件为 DOWN（与 rabbit 组件行为一致），事实源始终是 MySQL。
  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info
  # 前端顶栏健康徽标读取组件细分（db/rabbit/redis）；演示项目无鉴权，直接 always
  endpoint:
    health:
      show-details: always

# 日志级别中附带 trace_id，配合 TraceIdFilter 写入的 MDC 使用
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{trace_id:-}]"

# 后续迭代按 be-td.md 补充 Redis/导出目录等配置（RabbitMQ 与 Outbox 分发参数见上；
# export.outbox.dispatch-delay-ms / export.outbox.confirm-timeout-ms 走 @Value 默认值 5000）。
# 建表脚本放置在 src/main/resources/db/migration/V x__xxx.sql，由 Flyway 启动时自动执行。
mybatis:
  map-underscore-to-camel-case: true                  # 下划线列名 -> 驼峰属性
  arg-name-based-constructor-auto-mapping: true       # record 实体按构造器参数名自动映射（需 -parameters 编译参数，starter parent 默认开启）
  mapper-locations: classpath:mapper/**/*.xml          # XML 动态 SQL（订单查询见 mapper/OrderMapper.xml）
